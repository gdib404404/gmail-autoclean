name: Apply decisions

# Decisions are applied automatically at every digest run. Use this to apply them
# right now (works from the GitHub mobile app too).
on:
  workflow_dispatch:

concurrency:
  group: email-scanner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Delete, unsubscribe, and filter approved senders
        run: python -m emailscanner apply
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
